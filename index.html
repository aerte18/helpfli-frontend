    <style>
      /* Natychmiastowy splash — widoczny zanim załaduje się React/CSS (Safari mobile) */
      .qs-boot {
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: #312e81;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .qs-boot-mark {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .qs-boot-spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid rgba(79, 70, 229, 0.2);
        border-top-color: #4f46e5;
        border-radius: 9999px;
        animation: qs-spin 0.8s linear infinite;
      }
      @keyframes qs-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- SW: wyrejestruj w tle BEZ reload (reload podwajał czas ladowania na Safari) -->
    <script>
      (function () {
        try {
          if (!("serviceWorker" in navigator)) return;
          if (localStorage.getItem("qs_sw_cleanup_done")) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (!regs.length) {
              localStorage.setItem("qs_sw_cleanup_done", "1");
              return;
            }
            Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                if ("caches" in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              })
              .finally(function () {
                localStorage.setItem("qs_sw_cleanup_done", "1");
              });
          });
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <div class="qs-boot" aria-live="polite" aria-busy="true">
        <div class="qs-boot-mark">Helpfli</div>
        <div class="qs-boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
